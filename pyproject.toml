[project]
name = "bolo"
version = "0.0.1"
description = "Toolkit for understanding spoken Hinglish voice commands on edge devices"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bolo = "bolo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bolo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
