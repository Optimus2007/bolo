[project]
name = "bolo"
version = "0.1.0"
description = "Offline, private Hinglish voice commands: speech to a safe, grounded action on a laptop or phone"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = ["torch>=2.2", "numpy"]
speech = ["torch>=2.2", "numpy", "transformers>=4.45"]

[project.scripts]
bolo = "bolo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bolo"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "bolo/configs"

[tool.pytest.ini_options]
testpaths = ["tests"]
