<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -175 240 290" width="160" height="193" role="img" aria-label="Myna, a teal bird">
  <style>
    .lids { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4s infinite; }
    .wave { fill: none; stroke: #1c968c; stroke-width: 6; stroke-linecap: round; animation: wave 1.6s infinite; }
    .wave:nth-of-type(2) { animation-delay: .2s; } .wave:nth-of-type(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 95%, 100% { transform: scaleY(0); } 97% { transform: scaleY(1); } }
    @keyframes wave { 50% { opacity: .25; } }
  </style>
