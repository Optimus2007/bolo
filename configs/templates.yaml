  - {t: "{_:contacts}", reason: ambiguous}
  - {t: "{_:folders} ka kya", reason: ambiguous}
  - {t: "<term> ya <claude> <open_v>", reason: ambiguous}
  - {t: "<pre?> kuch <open_v>", reason: ambiguous}
  - {t: "isko <open_v>", reason: ambiguous}
  # fillers / noise / cancel
  - {t: "umm haan", reason: filler}
  - {t: "ek second ruko", reason: filler}
  - {t: "kuch nahi", reason: filler}
