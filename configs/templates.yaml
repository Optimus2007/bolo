  - "<pre?> {folder} wale folder mein <claude> <open_v>"
  - "<pre?> <claude> <open_v> {folder} <folder_w?> <loc> <post?>"
  - {t: "<pre?> <claude> <open_v> <post?>", w: 0.6}
  - "<pre?> {folder} <folder_w?> <loc> <claude> chalao"
  - "<pre?> {folder} project <loc> <claude> start karo"
  - "<pre?> {folder} <folder_w?> <loc> <claude> se kaam karna hai"
  - "<pre?> {folder} <loc> <claude> ko bulao"
  - "<pre?> <claude> {folder} <folder_w?> <loc> <open_v>"
  - "<pre?> {folder} ke liye <claude> <open_v>"
  - "kya aap {folder} <folder_w?> <loc> <claude> khol sakte ho"
  - {t: "open claude in {folder}", lang: en}
  - {t: "start claude code in the {folder} <folder_w>", lang: en}
  - {t: "launch claude in {folder} please", lang: en}
  - {t: "start claude code", lang: en, w: 0.4}

