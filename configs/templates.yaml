  - {t: "<pre?> {_:apps} close karo", reason: unsupported}
  - {t: "<pre?> {_:contacts} ko message bhejo", reason: unsupported}
  - {t: "<pre?> {_:contacts} ko whatsapp pe message karo", reason: unsupported}
  - {t: "<pre?> {_:folders} folder delete karo", reason: unsupported}
