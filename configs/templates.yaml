  - {t: "aaj ka mausam kaisa hai", reason: ood}
  - {t: "<pre?> ek joke sunao", reason: ood}
  - {t: "kal meeting kab hai", reason: ood}
  - {t: "<pre?> khana order karo", reason: ood}
  - {t: "<pre?> koi gaana bajao", reason: ood}
