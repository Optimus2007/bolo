# Bolo templates v0.
# Token syntax (space separated):
#   {slot}         labeled slot, filled from the slot type's pool (schema.yaml)
#   {slot:pool}    labeled slot, filled from an explicit pool
#   {_:pool}       UNlabeled filler from a pool (used in negatives, e.g. a name in an unsupported request)
#   <class>        phrase class from lexicon.yaml; <class?> = optional (50%)
#   word           literal word; must exist in lexicon hindi_words/english_words
# Entry options: w (weight, default 1), lang: en (English-only phrasing; numbers rendered as digits/English),
#   kind: folder|file (restricts `path`), only: {slot: [values]} (restricts closed values), reason (negatives).

open_terminal:
  - "<pre?> {folder} <folder_w?> <loc> <term> <open_v> <post?>"
  - "<pre?> {folder} wale folder mein <term> <open_v>"
  - "<pre?> <term> <open_v> {folder} <folder_w?> <loc> <post?>"
  - {t: "<pre?> <term> <open_v> <post?>", w: 0.6}
  - "<pre?> {folder} <folder_w?> <loc> ek <term> <open_v>"
  - "<pre?> {folder} ka <term> <open_v> <post?>"
  - "<pre?> {folder} <folder_w?> <loc> <term> chahiye"
  - "<pre?> mujhe {folder} <folder_w?> <loc> <term> chahiye"
  - {t: "<pre?> naya <term> <open_v> <post?>", w: 0.4}
  - "<pre?> {folder} <folder_w?> <loc> new <term> <open_v>"
  - "<pre?> <term> <open_v> aur {folder} <folder_w?> <loc> le chalo"
  - "kya aap {folder} <folder_w?> <loc> <term> khol sakte ho"
  - {t: "open <term> in {folder}", lang: en}
  - {t: "open a <term> in the {folder} <folder_w>", lang: en}
  - {t: "launch <term> in {folder} please", lang: en}
  - {t: "open a new <term> window in {folder}", lang: en}
  - {t: "open <term>", lang: en, w: 0.4}

open_claude_in_folder:
