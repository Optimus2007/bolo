  - {t: "<pre?> laptop restart karo", reason: unsupported}
  - {t: "<pre?> screen lock karo", reason: unsupported}
  - {t: "<pre?> wifi band karo", reason: unsupported}
  - {t: "<pre?> bluetooth on karo", reason: unsupported}
  - {t: "<pre?> {_:apps} uninstall karo", reason: unsupported}
  - {t: "<pre?> {_:apps} install karo", reason: unsupported}
  - {t: "<pre?> naya folder banao", reason: unsupported}
  - {t: "<pre?> {_:files} rename karo", reason: unsupported}
  - {t: "<pre?> wallpaper badlo", reason: unsupported}
  # incomplete (required slot missing)
  - {t: "<pre?> call karo", reason: incomplete}
  - {t: "<pre?> <open_v>", reason: incomplete}
  - {t: "<pre?> folder <open_v>", reason: incomplete}
  - {t: "<pre?> file <open_v>", reason: incomplete}
