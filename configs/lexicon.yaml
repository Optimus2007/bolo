# Phrase classes used as <name> in templates. Each variant is a space-separated phrase.
classes:
  open_v: [kholo, khol do, kholna, khol de, open karo, open kar do, kholiye, khol dijiye, open kijiye,
           chalu karo, start karo, launch karo, chalao, chala do]
  karo_v: [karo, kar do, lagao, laga do, kijiye, karna]
  batao_v: [batao, bata do, dikhao, check karo]
  set_v: [karo, kar do, rakho, rakh do, set karo, set kar do]
  loc: [mein, ke andar]
  open_f: [kholo, khol do, kholna, khol de, open karo, open kar do, kholiye, khol dijiye, open kijiye]
  folder_w: [folder, directory]
  term: [terminal, terminal window, shell, command line]
  claude: [claude, claude code]
  pe: [pe, par, se]
  pct: [percent]
  vol: [volume, awaaz, sound]
  bright: [brightness, screen brightness, roshni, screen ki roshni]
  pre: [yaar, zara, please, bhai, ek baar, accha, umm, suno, haan, chalo, yaar zara, please zara]
  post: [please, yaar, na, bhai, abhi, zara]

