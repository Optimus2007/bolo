  pe: [pe, par, se]
  pct: [percent]
  vol: [volume, awaaz, sound]
  bright: [brightness, screen brightness, roshni, screen ki roshni]
  song: [gaana, song, music, gaane]
  lo_v: [lo, le lo, lena, le lijiye, le do, khicho]
  lagao_v: [lagao, laga do, set karo, set kar do, chalu karo, start karo]
  remind_v: [yaad dilana, yaad dila dena, remind karna, remind kar dena, yaad dilao]
  search_v: [search karo, search kar do, dhoondo, dhundho, dhoondh do, khojo]
  close_v: [band karo, band kar do, close karo, close kar do, quit karo, bandh karo]
  find_v: [dhoondo, dhundho, dhoondh do, search karo, find karo, dhoondh ke do]
